<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <link rel="stylesheet" href="curr.css">
</head>

<body>

    <div class="container">

        <h2>Currency Converter</h2>

        <form>

            <div class="amount">
                <p>Enter amount</p>
                <input type="text" value="100">
            </div>

            <div class="dropdown">

                <!-- FROM CURRENCY -->
                <div class="from">
                    <p>From</p>

                    <div class="select-container">

                        <img src="https://flagsapi.com/US/flat/64.png" alt="USA Flag">

                        <select name="from">

                        </select>

                    </div>
                </div>


                <!-- TO CURRENCY -->
                <div class="to">

                    <p>To</p>

                    <div class="select-container">

                        <img src="https://flagsapi.com/IN/flat/64.png" alt="India Flag">

                        <select name="to">

                        </select>

                    </div>

                </div>

            </div>

            <div class="msg">1 USD = 80 INR</div>
            <button>Get Exchange Rate</button>

        </form>

    </div>
    <script src="code.js"></script>
    <script src="curr.js"></script>

</body>

</html>
